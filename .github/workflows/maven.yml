name: GitHub CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Package the full reactor
        run: mvn clean package -DskipTests=true -Dmaven.javadoc.skip=true -B -V

  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '25']
        module:
          - demo-helloworld
          - demo-properties
          - demo-exception-handler
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test and package ${{ matrix.module }}
        run: mvn -B -V -pl "${{ matrix.module }}" -am clean package
