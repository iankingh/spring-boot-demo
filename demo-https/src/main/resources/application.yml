server:
  ssl:
    # SECURITY: 此 tracked key store 及其密码仅供历史 demo 本机测试，禁止用于部署环境。
    # 生成新的本机 fixture 请参考仓库根目录 SECURITY.md。
    # 证书路径
    key-store: classpath:server.keystore
    key-alias: tomcat
    enabled: true
    key-store-type: JKS
    #与申请时输入一致
    key-store-password: ${DEMO_HTTPS_SRC_MAIN_RESOURCES_KEY_STORE_PASSWORD}
    # 浏览器默认端口 和 80 类似
  port: 443
